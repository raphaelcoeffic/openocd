#
# Texas Instruments CC27xx (SimpleLink Low Power F3) - ARM Cortex-M33
#
# http://www.ti.com
#
# Main flash, CCFG and SCFG are erased and written per sector by the boot
# ROM's flash functions (cc27xx flash driver): no chip erase, the HSM firmware
# stays as it is. Sectors protected by the CCFG (often the CCFG and SCFG
# themselves) need "cc27xx mass_erase" first (keeps the HSM firmware); until
# the next reset, the writes then go through SACI:
#   init; cc27xx mass_erase; flash write_image image.elf; reset
#
# With SWD connected, the boot ROM waits in SACI (its command interface on
# the SEC-AP, the AHB-AP closed) after any reset. The reset events reset
# through the SEC-AP and leave SACI: no reset pin needed. "reset halt" stops
# at the application's first instruction. A blank device stays in SACI.
#
# FLASHSIZE: main flash size, needed for a blank device (default: read from
# the device once booted)
#

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME cc27xx
}

if { [info exists DAP_SWD_ID] } {
	set _DAP_SWD_ID $DAP_SWD_ID
} else {
	set _DAP_SWD_ID 0x6ba02477
}

if { [info exists WORKAREABASE] } {
	set _WORKAREABASE $WORKAREABASE
} else {
	set _WORKAREABASE 0x20000000
}

if { [info exists WORKAREASIZE] } {
	set _WORKAREASIZE $WORKAREASIZE
} else {
	set _WORKAREASIZE 0x2000
}

if { [info exists FLASHSIZE] } {
	set _FLASHSIZE $FLASHSIZE
} else {
	set _FLASHSIZE 0
}

transport select swd

swd newdap $_CHIPNAME cpu -expected-id $_DAP_SWD_ID
dap create $_CHIPNAME.dap -tap $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap -ap-num 0
$_TARGETNAME configure -work-area-phys $_WORKAREABASE \
	-work-area-size $_WORKAREASIZE -work-area-backup 0

flash bank $_CHIPNAME.flash cc27xx 0 $_FLASHSIZE 0 0 $_TARGETNAME
flash bank $_CHIPNAME.ccfg cc27xx 0x4e020000 0 0 0 $_TARGETNAME
flash bank $_CHIPNAME.scfg cc27xx 0x4e040000 0 0 0 $_TARGETNAME

$_TARGETNAME configure -event reset-assert {
	cc27xx reset_assert
}

$_TARGETNAME configure -event reset-deassert-post {
	cc27xx saci_exit
}

# Connecting to a device that waits in SACI: let it run
$_TARGETNAME configure -event examine-start {
	cc27xx saci_exit
}
